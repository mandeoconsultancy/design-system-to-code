name: Design System Sync

on:
  workflow_dispatch:
    inputs:
      figma_file_key:
        description: Figma file key for the source asset
        required: false
        default: ''
      figma_node_id:
        description: Figma node ID for the icon or component to export
        required: false
        default: ''
      figma_page_node_id:
        description: Figma page or frame node ID used as the change-detection root for the design sync
        required: false
        default: ''
      asset_path:
        description: Local repo path for the exported SVG asset. Used when not pulling from Figma directly.
        required: false
        default: design-assets/icons/upload-cloud.svg
      framework:
        description: Which framework output to generate
        required: false
        default: all
        type: choice
        options:
          - react
          - angular
          - all
      branch_name:
        description: Optional branch name for the generated PR
        required: false
        default: design-sync

jobs:
  sync-design-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull latest changed assets from Figma
        if: ${{ github.event.inputs.figma_file_key != '' && github.event.inputs.figma_page_node_id != '' }}
        run: |
          node scripts/figma-sync.mjs \
            --file-key "${{ github.event.inputs.figma_file_key }}" \
            --page-node-id "${{ github.event.inputs.figma_page_node_id }}" \
            --framework "${{ github.event.inputs.framework }}" \
            --token "$FIGMA_TOKEN" \
            --poll

      - name: Generate component and storybook files
        if: ${{ github.event.inputs.figma_file_key == '' || github.event.inputs.figma_page_node_id == '' }}
        run: node scripts/generate-icon.mjs "${{ github.event.inputs.asset_path }}" --framework "${{ github.event.inputs.framework }}"

      - name: Run linting and build checks
        run: |
          npm run lint
          npm run build
          npm run build-storybook

          if [ "${{ github.event.inputs.framework }}" = "angular" ] || [ "${{ github.event.inputs.framework }}" = "all" ]; then
            npm run build-storybook:angular
          fi

      - name: Create pull request for review
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.event.inputs.branch_name }}
          commit-message: 'feat: sync design asset from Figma'
          title: 'Design asset sync: ${{ github.event.inputs.asset_path }}'
          body: |
            ## Design sync update

            This automation generated a React icon component and Storybook story from the updated design asset.

            ### Required review stages
            1. Gate 1: Developer review before merge
            2. Gate 2: UX/Product review in Storybook after publish

            ### Checks performed
            - lint
            - Vite build
            - Storybook build

            ### Asset
            `${{ github.event.inputs.asset_path }}`
          delete-branch: true

      - name: Show PR summary
        if: always()
        run: |
          if [ -n "${{ steps.create_pr.outputs.pull-request-number }}" ]; then
            echo "Created PR #${{ steps.create_pr.outputs.pull-request-number }}"
            echo "Branch: ${{ steps.create_pr.outputs.pull-request-branch }}"
          else
            echo "PR creation was not permitted by repository settings. The workflow still completed successfully and the generated design changes are ready for review in the branch output."
          fi
